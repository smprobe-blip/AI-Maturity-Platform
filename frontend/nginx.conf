server {
    listen 80;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    # CSP для Keycloak iframe
    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:8080 https://localhost:8080;" always;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy на backend.
    # В production /api перехватывает Caddy (этот блок не используется).
    # Локально — единственный путь SPA к API.
    # resolver 127.0.0.11 (docker DNS) + переменная = динамический резолвинг,
    # защита от кэширования старого IP backend после рестартов.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_url "http://backend:8000";
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Кэш статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
