name: Deploy to VPS

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 72.56.14.151 >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Verify key
        run: |
          echo "Отпечаток ключа на раннере:"
          ssh-keygen -y -f ~/.ssh/deploy_key | ssh-keygen -l -f -
          echo "Ожидаемый отпечаток: SHA256:r3Xi61hHru4JHbTwFEukF8u8UAGrvaSbF8J8Vimtr5o"
      
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key root@72.56.14.151 "/opt/deploy.sh"
