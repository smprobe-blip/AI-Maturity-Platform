name: Deploy to VPS

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 72.56.14.151 >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Test connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            deployer@72.56.14.151 "echo 'SSH_OK'"
      
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            deployer@72.56.14.151 "sudo /opt/deploy.sh"
