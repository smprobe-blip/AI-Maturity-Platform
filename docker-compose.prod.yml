version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai-maturity-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data_storage:/data_storage
    ports:
      - "8000:8000"
    depends_on:
      - db
      - keycloak
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: https://audit.netbrainpower.ru/auth
        VITE_KEYCLOAK_REALM: ai-maturity
        VITE_KEYCLOAK_CLIENT_ID: frontend-spa
    container_name: ai-maturity-frontend
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: ai-maturity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_maturity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  keycloak-db:
    image: postgres:15-alpine
    container_name: ai-maturity-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "IWi?FJE?qFJetigT69CL"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ai-maturity-keycloak
    restart: unless-stopped
    command: start --http-enabled=true --hostname=audit.netbrainpower.ru --import-realm
    depends_on:
      - keycloak-db
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "IWi?FJE?qFJetigT69CL"
      KEYCLOAK_ADMIN: kcadmin
      KEYCLOAK_ADMIN_PASSWORD: "_-n92uG_%0Pmfuo0_fAAnw"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: ai-maturity-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /opt/netbrainpower.ru:/opt/netbrainpower.ru:ro
      - /var/log/caddy:/var/log/caddy
    networks:
      - app-network

  baserow-redis:
    image: redis:7-alpine
    container_name: ai-maturity-baserow-redis
    restart: unless-stopped
    networks:
      - app-network

  baserow:
    image: baserow/baserow:1.22.3
    container_name: ai-maturity-baserow
    restart: unless-stopped
    environment:
      BASEROW_PUBLIC_URL: http://baserow:80
      BASEROW_EXTRA_ALLOWED_HOSTS: localhost:3001
      BASEROW_ADMIN_EMAIL: baserow-admin@netbrainpower.ru
      BASEROW_ADMIN_PASSWORD: oYu2BTZJNIWBZfjLvzOo
      DATABASE_URL: postgres://baserow:m62q0PB169LrGXJANz26@db:5432/baserow
      REDIS_URL: redis://baserow-redis:6379
    volumes:
      - baserow_data:/baserow/data
    depends_on:
      - db
      - baserow-redis
    networks:
      - app-network

volumes:
  postgres_data:
  baserow_data:
  caddy_data:
  caddy_config:
  keycloak_db_data:

networks:
  app-network:
    driver: bridge
